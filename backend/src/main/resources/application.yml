# Base config shared across profiles. Secrets are never here — env vars only,
# per 12_Security.md §9 and 15_Deployment.md §2.
spring:
  application:
    name: devtrack-ai-backend
  # Defaults local runs (mvnw spring-boot:run, IDE run configs, plain `mvnw test`
  # without an explicit profile) to "dev" so they work without remembering a flag —
  # this is exactly the friction that caused the JwtService NPE seen when running
  # spring-boot:run directly. Railway always sets SPRING_PROFILES_ACTIVE=prod as a
  # real environment variable in production (15_Deployment.md §2's checklist),
  # which takes precedence over this default — so this change is safe for prod,
  # not just convenient for local dev.
  profiles:
    active: dev
  jpa:
    open-in-view: false          # avoid the classic lazy-loading-in-view footgun
    hibernate:
      ddl-auto: validate         # schema is Flyway-managed, never Hibernate auto-DDL — 05_Database_Architecture.md §2
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info    # 14_DevOps.md §7 — health check target for Railway
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/docs/openapi
  swagger-ui:
    path: /api/v1/docs

devtrack:
  ai:
    # 09_AI_Architecture.md §7 per-user daily cap, now per plan (shared across all AI features).
    free-daily-request-limit: 3
    pro-daily-request-limit: 30

  gemini:
    model: gemini-3.8-flash      # verify against Google's current model list at deploy time — see GeminiProperties javadoc

  resume-ats:
    cache-ttl: 24h                # AgentConfig.cacheTtl for RESUME_ATS — Redis-expires the exact-match cache, not a correctness mechanism

  career-assistant:
    cache-ttl: 6h                 # AgentConfig.cacheTtl for CAREER_ASSISTANT — the key already changes when source data changes

  billing:
    razorpay:
      # Test-mode keys locally (rzp_test_...), live keys in prod — env vars only, never committed.
      # Blank key id/secret = billing disabled (status says so; order creation is refused).
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
