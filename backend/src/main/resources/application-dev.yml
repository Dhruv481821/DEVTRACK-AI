# Local development profile — matches docker-compose.yml at the repo root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devtrack_dev
    username: devtrack
    password: devtrack_local_only
  jpa:
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            # Sourced from real env vars (set via `setx`, per 15_Deployment.md §1
            # step 3) — never hardcoded, even in a dev-only file, since these are
            # real Google Cloud credentials, unlike the throwaway JWT keypair below.
            # Fallback placeholders (after the colon) let the app boot cleanly
            # before you've done the Google Cloud Console setup — the OAuth login
            # flow just won't work against real Google until real values are set,
            # but this doesn't break context startup or the existing test suite.
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:placeholder-client-secret}
            scope: openid, email, profile

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.devtrack: DEBUG

devtrack:
  jwt:
    # DEV-ONLY keypair, generated for this scaffold — never used in prod, where
    # JWT_PRIVATE_KEY/JWT_PUBLIC_KEY come from Railway env vars instead
    # (application-prod.yml, 15_Deployment.md §2). Fine to commit since it only
    # ever signs tokens on a developer's own machine against a local DB.
    private-key: ""
    public-key: ""
  cors:
    allowed-origin: http://localhost:5173
  frontend:
    base-url: http://localhost:5173
  resend:
    # Blank is fine for local dev — Resend calls will fail auth and get logged
    # (ResendEmailService swallows the failure), never crash the app. Fill in a
    # real key only if you actually want to test email delivery locally.
    api-key: ""
